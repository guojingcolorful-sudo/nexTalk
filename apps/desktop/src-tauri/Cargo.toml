[package]
name = "nextalk-desktop"
version = "0.1.0"
description = "NexTalk desktop app (console + dual-pane windows)"
edition = "2021"

[lib]
name = "nextalk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.0", features = ["fs", "set-header"] }
futures-util = "0.3.34"
rand = "0.10.2"
local-ip-address = "0.6.13"

[dev-dependencies]
tokio-tungstenite = "0.28"

[profile.release]
strip = true
lto = true
codegen-units = 1
