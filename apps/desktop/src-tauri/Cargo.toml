[package]
name = "nextalk-desktop"
version = "0.1.0"
description = "NexTalk desktop app (console + dual-pane windows)"
edition = "2021"

[lib]
name = "nextalk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.0", features = ["fs", "set-header"] }
futures-util = "0.3.34"
rand = "0.10.2"
local-ip-address = "0.6.13"
# --- 02-02 vendor clients -------------------------------------------------
# tokio-tungstenite / hmac / sha2: package-legitimacy gate approved 2026-10-01
# (crates.io page + upstream repo + release activity verified, MSRV 1.85 ≤
# rustc 1.98). The 0.28 dev-dep is superseded by this 0.30 runtime dependency —
# the integration tests link the same client the app ships.
# native-tls: the macOS TLS backend (Security.framework); wss:// is unreachable
# without one, and the rustls provider would drag in aws-lc-rs' cmake build.
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
hmac = "0.13.0"
sha2 = "0.11.0"
# base64: 讯飞 signs and ships audio in base64 (already in the tree via reqwest).
base64 = "0.22.1"
# thiserror / reqwest / uuid: already resolved in Cargo.lock as transitive deps.
thiserror = "2.0.20"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "stream",
    "native-tls",
] }
uuid = { version = "1.26.0", features = ["v4"] }

# --- 02-04 enrollment capture + resample -----------------------------------
# cpal / hound / rubato: package-legitimacy gate approved 2026-10-05 (user
# verified the crates.io pages and upstream repos; cpal 0.18.x was the
# 02-RESEARCH [SUS] item — RustAudio/cpal, million-scale downloads, active
# releases). cpal 0.18.2 = CoreAudio capture, hound 3.5.1 = WAV I/O (ruuda/
# hound), rubato 5.0.1 = offline resampling (5.0 is the API rewrite — the old
# FftFixedIn constructor no longer exists; see audio/resample.rs).
cpal = "0.18.2"
hound = "3.5.1"
rubato = "5.0.1"

# --- 02-05 AEC3 (T5.1) -----------------------------------------------------
# webrtc-audio-processing: package-legitimacy gate approved 2026-10-05 (the
# RustAudio crate wrapping the same WebRTC/PulseAudio AEC snapshot the
# requirement doc names). **Pin with `~`, not `^`**: this crate's version tracks
# the upstream PulseAudio WebRTC snapshot, not semver — a 2.x bump can be a
# breaking API change (the 0.1→2.0 jump was), so a patch-only range is the
# honest constraint. `bundled` compiles the vendored C++ via meson+ninja
# (see README "Native audio build prerequisites"); the first build also fetches
# abseil-cpp, so it needs network once. Resolved: 2.0.4.
webrtc-audio-processing = { version = "~2.0", features = ["bundled"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
