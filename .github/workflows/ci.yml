# NexTalk CI — 五条并行车道：web 单测、e2e、Rust 全量、延迟 rig 冒烟、
# 失败案例回归（tools/vendor-experiments/failure-cases：案卷校验 + 逐例执行
# regression_test 指向的真实测试，零供应商 key、零网络）。
#
# 研究修正 8（02-01）：本仓库没有 Cargo workspace —— 只有
# apps/desktop/src-tauri/Cargo.toml 一个 crate 清单。所有 cargo 命令一律写成
# `cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml`；任何假定
# 存在 workspace 根清单的调用都会直接失败。
#
# 延迟 rig 车道是确定性的、零网络的（脚本化阶段双打注入五个流式边界），
# 因此不需要任何供应商 key。真实的 live 端到端测量不进 CI：它需要凭据，
# 属于阶段门禁的手动记录工件（`cargo test --test latency_rig -- --ignored`）。
#
# runner 用 macos-13（x86_64），与目标机 macOS 12.7 Intel 路径一致。
#
# 构建工具链（02-05 T5.1/T5.5）：AEC3 的 C++ 来自 webrtc-audio-processing 的
# `bundled` 特性，它用 meson+ninja 在构建期现场编译。runner 不预装这两件，
# 所以每条编译 crate 的车道都在第一次 cargo 调用前 `pip3 install --user`；
# `--user` 装的脚本落在 `$(python3 -m site --user-base)/bin`，该目录不在
# runner 的 PATH 上，必须显式追加到 $GITHUB_PATH（对后续步骤生效，顺序不能
# 反）。本地同理：`~/.cargo/env` 不管这个，脚本里自己 export。
# 三条车道都装了：rust（全量）、latency-rig（只跑 rig 目标，但同样要编译
# 整个 crate）、failure-cases（regression_test 指向 cargo 目标）。

name: CI

on:
  push:
  pull_request:

jobs:
  unit-web:
    name: unit-web
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test

  e2e:
    name: e2e
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      # playwright.config.ts 的两条 webServer 都跑 `vite preview`，它只服务
      # 已构建的 dist —— 没有这一步车道起不来。
      - run: pnpm build
      - run: pnpm exec playwright test

  rust:
    name: rust
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 首次为 Tauri 依赖树编译；缓存命中后显著缩短。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # meson+ninja 必须在 cargo 之前：bundled 特性在 build.rs 里就要它们。
      - run: pip3 install --user "meson==1.11.2" "ninja==1.13.2"
      - run: echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
      # 全量：音频链路（audio_chain / audio_devices）全部走脚本化后端，
      # 零网络、零真实设备依赖；唯一的真设备路径是 #[ignore] 的探针。
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  latency-rig:
    name: latency-rig
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pip3 install --user "meson==1.11.2" "ninja==1.13.2"
      - run: echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
      # 预算断言在 CI 中硬失败：e2e > 2000ms 即红，并打印归因阶段。
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --test latency_rig -- --nocapture

  failure-cases:
    name: failure-cases
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pip3 install --user "meson==1.11.2" "ninja==1.13.2"
      - run: echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
      # 先校验案卷本身（schema/枚举/id ≥20/回归目标真实存在），再逐例执行
      # regression_test：cargo 目标走 --manifest-path，vitest 目标按命中包执行。
      - run: node tools/vendor-experiments/failure-cases/run.mjs --check
      - run: node tools/vendor-experiments/failure-cases/run.mjs --run
